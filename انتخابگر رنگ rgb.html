<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار رنگ پایتون | Python Color Picker</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary-color: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .color-preview {
            width: 100%;
            height: 150px;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.2s ease;
        }

        input[type="color"] {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .result-box {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #e9ecef;
        }

        .result-box:hover {
            background: #eef2f7;
        }

        .result-box span {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #34495e;
        }

        .label {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-bottom: 0.5rem;
            display: block;
            text-align: right;
        }

        .copy-hint {
            font-size: 0.7rem;
            color: var(--primary-color);
        }

        /* انیمیشن برای کپی شدن */
        .copied::after {
            content: "کپی شد!";
            position: absolute;
            background: #2ecc71;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 انتخابگر رنگ برای پایتون</h1>
    
    <div id="preview" class="color-preview" style="background-color: #3498db;"></div>

    <label class="label">رنگ را از اینجا انتخاب کنید:</label>
    <input type="color" id="colorPicker" value="#3498db">

    <label class="label">کد HEX (مناسب برای Matplotlib):</label>
    <div class="result-box" onclick="copyToClipboard('hexText')">
        <span id="hexText">#3498db</span>
        <span class="copy-hint">کپی</span>
    </div>

    <label class="label">کد RGB (مناسب برای Pygame/Tkinter):</label>
    <div class="result-box" onclick="copyToClipboard('rgbText')">
        <span id="rgbText">(52, 152, 219)</span>
        <span class="copy-hint">کپی</span>
    </div>

    <p style="font-size: 0.7rem; color: #bdc3c7;">با کلیک روی هر باکس، کد کپی می‌شود.</p>
</div>

<script>
    const colorPicker = document.getElementById('colorPicker');
    const preview = document.getElementById('preview');
    const hexText = document.getElementById('hexText');
    const rgbText = document.getElementById('rgbText');

    // تابع تبدیل Hex به RGB
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return (${r}, ${g}, ${b});
    }
// به‌روزرسانی رنگ‌ها هنگام تغییر
    colorPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        preview.style.backgroundColor = color;
        hexText.innerText = color.toUpperCase();
        rgbText.innerText = hexToRgb(color);
    });

    // تابع کپی کردن در حافظه
    function copyToClipboard(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("کد کپی شد: " + text);
        });
    }
</script>

</body>
</html>
